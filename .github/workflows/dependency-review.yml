name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # Owner-approved exception (2026-11-06) for the waitlist Zod
          # pin; see "Dependency-review exception" in
          # docs/waitlist-migration.md. GHSA-mrhx-c7xc-m3w5 only.
          allow-ghsas: GHSA-mrhx-c7xc-m3w5
